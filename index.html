<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Для Вас</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<img class="rose rose-tl" src="rose-tl.png" alt="">
<img class="rose rose-tr" src="rose-tr.png" alt="">
<img class="rose rose-bl" src="rose-bl.png" alt="">
<img class="rose rose-br" src="rose-br.png" alt="">

<div class="bg-glow"></div>
<div class="particles" id="particles"></div>

<main class="stage">
  <button class="envelope" id="envelope" aria-label="Открыть">
    <img class="wax-seal" src="seal.png" alt="">
  </button>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-content">
    <button class="modal-close" data-close aria-label="Закрыть">×</button>
    <div class="letter-wrap">
      <img src="letter.png" alt="Письмо" class="letter">
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
